services:
  jiexi520:
    build:
      context: .
      dockerfile: Dockerfile
    image: jiexi520:latest
    container_name: jiexi520
    restart: unless-stopped
    ports:
      - "3000:3000"
    # 运行时环境变量。建议把 .env 放在服务器上本目录（不会被 COPY 进镜像），
    # 至少要有 SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY / SUPABASE_SERVICE_ROLE_KEY。
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
